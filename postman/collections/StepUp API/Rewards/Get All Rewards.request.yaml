$kind: http-request
method: GET
url: '{{base_url}}/rewards/get'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code adalah 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response memiliki properti success = true", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response memiliki properti data berupa array", function () {
          var json = pm.response.json();
          pm.expect(json.data).to.be.an('array');
      });

      pm.test("Response memiliki properti total", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('total');
          pm.expect(json.total).to.be.a('number');
      });

      pm.test("Response time kurang dari 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
